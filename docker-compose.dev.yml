# Development override for Docker Compose
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_API_PREFIX=/api/v1
      - VITE_API_URL=http://localhost:8000
      - VITE_ENABLE_DEV_TOOLS=true
      - VITE_DEBUG=true
    command: npm run dev
    volumes:
      # Enable hot reload for frontend development
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - /app/node_modules # 匿名ボリュームでnode_modulesを保護
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    # Keep backend in development mode for hot reload
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    command: uvicorn koiki_ref_app.asgi:app --host 0.0.0.0 --port 8000 --reload # 開発時はリロード有効
    volumes:
      # Enable hot reload for backend development
      - ./app:/app/app:cached # 互換 wrapper
      - ./components:/app/components:cached # component code と Alembic
      - ./ops:/app/ops:cached # 運用・テストスクリプト

  keycloak:
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8090:8080"
      - "9000:9000"
