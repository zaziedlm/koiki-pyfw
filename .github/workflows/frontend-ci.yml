name: Frontend CI

on:
  push:
    branches: [main, dev/v0.8, security/backend-python-emsign-brotli]
  pull_request:
    branches: [main, dev/v0.8, security/backend-python-emsign-brotli]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
